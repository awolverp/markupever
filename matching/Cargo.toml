[package]
name = "matching"
version.workspace = true
edition.workspace = true
description = "matching implementation which supports selectors crate for treedom crate (optimized for markupever library)."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
cssparser = { version = "0.36.0" }
foldhash = { version = "0.2.0" }
hashbrown = {
  version = "0.17",
  default-features = false,
  features = [
    "default-hasher",
    "inline-more",
  ]
}
precomputed-hash = { version = "0.1.1" }
selectors = { version = "0.36.1" }
tendril = { version = "0.5" }
treedom = { path = "../treedom" }

[features]
default = []
