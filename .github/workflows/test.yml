name: Python Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  UV_PYTHON_DOWNLOADS: 0

jobs:
  test-python:
    name: ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ endsWith(matrix.python-version, 't') }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          [
            "3.10",
            "3.11",
            "3.12",
            "3.13",
            "3.14",
            "3.14t",
            "3.15",
            "3.15t",
            "pypy3.11",
          ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name == 'pull_request' && github.run_attempt == 1
        with:
          lookup-only: false
          shared-key: ${{ matrix.python-version }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: "Install dependencies"
        run: uv sync --locked --python ${{ matrix.python-version }} --no-default-groups --group ci --no-install-project

      - name: "Run maturin"
        run: uv run --no-sync maturin develop --locked

      - name: "Run pytest"
        run: uv run --no-sync pytest -v

  typecheck:
    name: type check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: "Install dependencies"
        run: uv sync --locked --python 3.13 --no-default-groups --group ci --group typecheck --no-install-project

      - name: "Run maturin"
        run: uv run --no-sync maturin develop --locked

      - name: "Run mypy"
        run: uv run --no-sync mypy

      - name: "Run pyright"
        run: uv run --no-sync pyright

      - name: "Check the stub against the compiled module"
        run: uv run --no-sync python -m mypy.stubtest markupever._rustlib

  test-os:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: "Use copy link mode on Windows"
        if: matrix.os == 'windows'
        shell: bash
        run: echo "UV_LINK_MODE=copy" >> "$GITHUB_ENV"

      - name: "Install dependencies"
        run: uv sync --locked --python 3.13 --no-default-groups --group ci --no-install-project

      - name: "Run maturin"
        run: uv run --no-sync maturin develop --locked

      - name: "Run pytest"
        run: uv run --no-sync pytest -v
