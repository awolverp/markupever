[package]
name = "markupever"
version.workspace = true
edition.workspace = true
description = "The fast, most optimal, and correct HTML & XML parsing library."
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[workspace]
members = ["matching", "treedom"]

[workspace.package]
version = "0.3.6"
edition = "2021"
readme = "README.md"
homepage = "https://github.com/awolverp/markupever"
repository = "https://github.com/awolverp/markupever.git"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "markupever"

[dependencies]
hashbrown = {
  version = "0.17",
  default-features = false,
  features = [
    "default-hasher",
    "inline-more",
  ]
}
matching = { path = "matching" }
parking_lot = { version = "0.12" }
pyo3 = {
  version = "0.29",
  default-features = false,
  features = [
    "extension-module",
    "macros",
  ]
}
treedom = { path = "treedom" }

[build-dependencies]
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"

[profile.release]
debug = false
strip = "symbols"
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
